name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Type gate BEFORE tests: vitest/esbuild transpile without checking
      # types, so a type error would otherwise cross the pipeline.
      - run: npm run typecheck
      - run: npm test
